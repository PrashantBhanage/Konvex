spring.application.name=konvex

konvex.matching.max-distance-km=5.0
konvex.matching.max-time-gap-seconds=60

konvex.demo.enabled=false

konvex.opensky.enabled=true
konvex.opensky.poll-interval-ms=30000
konvex.opensky.initial-delay-ms=5000
konvex.opensky.base-url=https://opensky-network.org

konvex.security.api-key=${KONVEX_API_KEY:}

# PostgreSQL history database.
konvex.db.url=${KONVEX_DB_URL:jdbc:postgresql://localhost:5432/konvex}
konvex.db.username=${KONVEX_DB_USERNAME:konvex}
konvex.db.password=${KONVEX_DB_PASSWORD:konvex}

spring.datasource.url=${konvex.db.url}
spring.datasource.username=${konvex.db.username}
spring.datasource.password=${konvex.db.password}
spring.datasource.hikari.maximum-pool-size=10

# Flyway owns the schema. Hibernate validates it without changing production tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false