spring.application.name=konvex

# Maximum distance (km) between two events for them to be considered a match
konvex.matching.max-distance-km=5.0
# Maximum time gap (seconds) between two events for them to be considered a match
konvex.matching.max-time-gap-seconds=60

# Optional local correlation demo. Keep disabled for normal service runs.
konvex.demo.enabled=false

# OpenSky live flight polling.
konvex.opensky.enabled=true
konvex.opensky.poll-interval-ms=30000
konvex.opensky.initial-delay-ms=5000
konvex.opensky.base-url=https://opensky-network.org

# Service-to-service API key. Set KONVEX_API_KEY in the environment for real deployments.
konvex.security.api-key=${KONVEX_API_KEY:}
